<app-modal-base
  title="Agregar Ítem"
  [isOpen]="isOpen()"
  (closed)="closed.emit()"
>
  <div modal-body>
    <div class="media-grid">
      @for (item of mediaItems(); track item.id) {
        <button
          type="button"
          class="media-card"
          (click)="selected.emit(item)"
        >
          <div class="media-card__thumb">▶</div>
          <div class="media-card__info">
            <span class="media-card__name">{{ item.fileName }}</span>
            <span class="media-card__meta">
              {{ item.durationSeconds }}s ·
              {{ (item.fileSize / 1048576).toFixed(1) }} MB
            </span>
          </div>
        </button>
      } @empty {
        <p class="empty-state">No hay archivos disponibles</p>
      }
    </div>
  </div>

  <div modal-footer>
    <button type="button" class="btn-secondary" (click)="closed.emit()">
      Cerrar
    </button>
  </div>
</app-modal-base>
