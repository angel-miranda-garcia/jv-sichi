services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin:/var/www/admin:ro
      - ./player:/var/www/player:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - api
    networks:
      - sichi-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - sichi-net

  mysql:
    image: mysql:8
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - sichi-net

volumes:
  mysql_data:
  uploads:

networks:
  sichi-net:
    driver: bridge
